<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d9e2e7"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><title>Полезные слова</title><style>
:root{--bg:#f5f0e7;--ink:#243746;--muted:#74838d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}main{max-width:620px;margin:auto;padding:24px 18px 40px}.top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}select,button{font:inherit;border:0;border-radius:14px;padding:12px 14px;background:white;color:var(--ink);box-shadow:0 2px 10px #00000010}button{cursor:pointer}.dir{grid-column:1/-1}.card{height:260px;background:white;border-radius:24px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:30px;font-weight:650;box-shadow:0 8px 24px #00000012;user-select:none}.jp{display:flex;flex-direction:column;gap:9px;align-items:center}.jp .kana{font-size:30px}.jp .kanji{font-size:25px;font-weight:550;color:#536672}.hint{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.next{grid-column:1/-1}.easy{background:#e6eee7}.hard{background:#f1ded8}.progress{height:12px;background:#e2ded7;border-radius:99px;overflow:hidden;margin-top:22px}.bar{height:100%;width:0;background:var(--ink);transition:.25s}.stats{text-align:center;color:var(--muted);font-size:14px;margin:8px}.reset{width:100%;margin-top:10px;background:transparent;box-shadow:none;color:var(--muted)}.status{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}.empty{font-size:18px;font-weight:500}</style></head><body><main><div class="top"><select id="topic"></select><button id="direction" class="dir">Japanese → Russian</button></div><div id="card" class="card">Загрузка…</div><div class="hint">Нажми на карточку, чтобы перевернуть</div><div class="actions"><button class="easy" id="easy">Легко</button><button class="hard" id="hard">Сложно</button><button class="next" id="next">Следующее слово</button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="stats" id="stats"></div><button class="reset" id="reset">Сбросить прогресс по теме</button><div class="status" id="status"></div></main><script>
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vQSVNCDt9tGf2LGImun7oKEs5QrSSvZgfYaDyPMch14o2jnkyu9-6IbVEyizMncv6RHIcY29EUMjfI-/pub?gid=0&single=true&output=csv';
const $=id=>document.getElementById(id);let words=[],current=null,flipped=false,dir='ja';const key='japaneseFlashcardsV2';let state=JSON.parse(localStorage.getItem(key)||'{}');state.ratings??={};
function save(){localStorage.setItem(key,JSON.stringify(state))}function csvParse(t){let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
const norm=s=>(s||'').trim().toLowerCase();function findCol(h,names){for(let n of names){let i=h.indexOf(n);if(i>=0)return i}return-1}function splitJapanese(s){s=(s||'').trim();if(!s)return['',''];let parts=s.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(parts.length>1)return[parts[0],parts.slice(1).join(' ')];let q=s.match(/^(.+?)[「『]([^」』]+)[」』]$/);if(q){let left=q[1].trim(),reading=q[2].trim();return /[\u3400-\u9fff々〆ヶ]/.test(left)?[left,reading]:[left,reading]}let m=s.match(/^(.+?)[ \t]+([\u3400-\u9fff々〆ヶ].*)$/);return m?[m[1].trim(),m[2].trim()]:[s,'']}
async function load(){let txt;try{let r=await fetch(CSV,{cache:'no-store'});if(!r.ok)throw 0;txt=await r.text();localStorage.setItem('japaneseCsvCacheV2',txt);$('status').textContent='Слова обновлены • офлайн-копия сохранена'}catch(e){txt=localStorage.getItem('japaneseCsvCacheV2');$('status').textContent=txt?'Офлайн-режим • использую сохранённые слова':'Не удалось загрузить слова'}if(!txt)return;let rows=csvParse(txt),h=rows.shift().map(norm);let ri=findCol(h,['russian','русский','перевод','ru']),ji=findCol(h,['japanese','японский','японское','ja']),ki=findCol(h,['kana','hiragana','хирагана','кана','reading']),kani=findCol(h,['kanji','кандзи']),ti=findCol(h,['topic','тема']);if(ri<0)ri=0;if(ji<0&&ki<0&&kani<0)ji=1;if(ti<0&&h.length>2)ti=2;words=rows.map((r,i)=>{let ru=(r[ri]||'').trim(),kana='',kanji='';if(ki>=0)kana=(r[ki]||'').trim();if(kani>=0)kanji=(r[kani]||'').trim();if(ji>=0){let [a,b]=splitJapanese(r[ji]);if(!kana)kana=a;if(!kanji)kanji=b}let topic=ti>=0?(r[ti]||'').trim():'';return{id:(kana+'|'+kanji+'|'+ru).toLowerCase(),ru,kana,kanji,topic:topic||'Без темы'}}).filter(x=>x.ru&&(x.kana||x.kanji));setupTopics();pick()}
function setupTopics(){let ts=['Все темы',...new Set(words.map(x=>x.topic))];$('topic').innerHTML=ts.map(t=>`<option>${esc(t)}</option>`).join('');if(state.topic&&ts.includes(state.topic))$('topic').value=state.topic}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function pool(){let t=$('topic').value;return words.filter(w=>t==='Все темы'||w.topic===t)}
function pick(){let p=pool();if(!p.length){current=null;$('card').innerHTML='<span class="empty">В этой теме пока нет слов</span>';update();return}let weighted=[];for(let w of p){let r=state.ratings[w.id]||0,weight=r<0?8:r>0?2:2;for(let i=0;i<weight;i++)weighted.push(w)}let candidates=weighted.filter(w=>!current||w.id!==current.id),a=candidates.length?candidates:weighted;current=a[Math.floor(Math.random()*a.length)];flipped=false;render();update()}
function jpHTML(w){let a=w.kana?`<div class="kana">${esc(w.kana)}</div>`:'',b=w.kanji&&w.kanji!==w.kana?`<div class="kanji">${esc(w.kanji)}</div>`:'';return `<div class="jp">${a}${b}</div>`}function render(){if(!current)return;let showJa=(dir==='ja'&&!flipped)||(dir==='ru'&&flipped);$('card').innerHTML=showJa?jpHTML(current):esc(current.ru)}function rate(v){if(!current)return;state.ratings[current.id]=v;save();pick()}function update(){let p=pool(),known=p.filter(w=>(state.ratings[w.id]||0)>0).length,total=p.length,pct=total?known/total*100:0;$('bar').style.width=pct+'%';$('stats').textContent=`${known} из ${total} отмечено «Легко»`}
$('card').onclick=()=>{if(current){flipped=!flipped;render()}};$('easy').onclick=()=>rate(1);$('hard').onclick=()=>rate(-1);$('next').onclick=pick;$('direction').onclick=()=>{dir=dir==='ja'?'ru':'ja';$('direction').textContent=dir==='ja'?'Japanese → Russian':'Russian → Japanese';flipped=false;render()};$('topic').onchange=()=>{state.topic=$('topic').value;save();pick()};$('reset').onclick=()=>{for(let w of pool())delete state.ratings[w.id];save();pick()};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');load();
</script></body></html>
